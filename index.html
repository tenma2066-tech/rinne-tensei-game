        ],
        face_male: [
            { rank: 'SSR', prob: 5, point: 40, items: ["国宝級イケメン", "世界が嫉妬する美貌", "歩く彫刻"], text: "存在が罪。息をするだけでモテます。" },
            { rank: 'SR', prob: 15, point: 30, items: ["爽やかスポーツマン", "クール系美男子", "知的エリート顔"], text: "学生時代は常にカースト上位確定です。" },
            { rank: 'R', prob: 55, point: 10, items: ["クラスに3人はいる顔", "フツメン", "清潔感だけはある男", "村人Aの顔"], text: "良くも悪くも目立たない、平和な顔立ちです。" },
            { rank: 'N', prob: 25, point: 0, items: ["前衛的な芸術作品のような顔", "初対面で警戒される顔", "進化の過程を思わせる顔", "指名手配犯に似ている顔"], text: "顔以外の全て（トーク力と財力）で勝負する人生になります。" }
        ],
        face_female: [
            { rank: 'SSR', prob: 5, point: 40, items: ["1000年に1人の美少女", "国民的アイドル級", "絶世の美女"], text: "人生のあらゆる扉が顔パスで開きます。" },
            { rank: 'SR', prob: 20, point: 25, items: ["学年マドンナ", "愛嬌たっぷりの小動物系", "清楚系お嬢様顔"], text: "かなり恵まれた容姿。貢がれる人生です。" },
            { rank: 'R', prob: 55, point: 10, items: ["メイク次第で化ける普通の顔", "量産型モブ顔", "フツメン", "親しみやすい顔"], text: "努力と自己プロデュース次第でどうにでもなる容姿です。" },
            { rank: 'N', prob: 20, point: 0, items: ["愛嬌だけで乗り切る必要がある顔", "強烈な個性を放つ顔", "呪術師のような顔", "なぜか常に怒っているように見える顔"], text: "強靭なメンタルと卓越したユーモアセンスが求められます。" }
        ],
        family: [
            { rank: 'PLR', prob: 2, point: 50, items: ["世界的IT企業の社長一族", "王族・貴族の末裔", "国家予算レベルの資産家"], text: "生まれた瞬間から人生アガリです。働く必要はありません。" },
            { rank: 'SSR', prob: 8, point: 40, items: ["代々続く名家", "巨大病院の院長一族", "アラブの石油王の家系"], text: "お金に困ることは一生ないでしょう。英才教育確定です。" },
            { rank: 'SR', prob: 20, point: 20, items: ["裕福な共働きエリート家庭", "地元の大地主", "成功した起業家の家"], text: "欲しいものは大体買ってもらえる、恵まれた環境です。" },
            { rank: 'R', prob: 50, point: 10, items: ["ごく一般的なサラリーマン家庭", "地方の公務員家庭", "小さな自営業の家庭"], text: "平穏で一般的な、温かい（かもしれない）家庭です。" },
            { rank: 'N', prob: 20, point: 0, items: ["毎日借金取りが来る家", "その日暮らしの極貧家庭", "屋根に穴が開いている家", "親が蒸発した家"], text: "スタートダッシュで大きく躓く、過酷なサバイバル環境です。" }
        ],
        job: [
            { rank: 'PLR', prob: 2, point: 50, items: jobs.PLR, text: "歴史に名を残すレベルの超絶エリート職です。世界の頂点。" },
            { rank: 'SSR', prob: 8, point: 40, items: jobs.SSR, text: "高収入・高ステータス！誰もが羨む花形職業です。" },
            { rank: 'SR', prob: 20, point: 30, items: jobs.SR, text: "安定感抜群の専門職。食いっぱぐれることはありません。" },
            { rank: 'R', prob: 40, point: 20, items: jobs.R, text: "社会を支える一般的な職業です。堅実に生きましょう。" },
            { rank: 'N', prob: 30, point: 0, items: jobs.N, text: "不安定、過酷、あるいは社会のレールから外れた生き方です。" }
        ]
    };

    const stepsInfo = [
        { id: 'country', name: '国ガチャ' },
        { id: 'gender', name: '性別ガチャ' },
        { id: 'face', name: '顔ガチャ' },
        { id: 'family', name: '家庭ガチャ' },
        { id: 'job', name: '職業ガチャ' }
    ];

    // --- 状態管理 ---
    let state = getInitialState();

    function getInitialState() {
        return {
            screen: 'title', // title, gacha, gameover, result
            lifespan: 100,
            stepIndex: 0,
            results: { country: null, gender: null, face: null, family: null, job: null },
            freeRolls: { country: 2, gender: 1, face: 1, family: 1, job: 1 },
            currentRollResult: null,
            isRolling: false
        };
    }

    // --- ロジック ---
    function roll(typeKey) {
        const data = gachaData[typeKey];
        const rand = Math.random() * 100;
        let sum = 0;
        for (const item of data) {
            sum += item.prob;
            if (rand <= sum) {
                const resultName = item.items[Math.floor(Math.random() * item.items.length)];
                return { rank: item.rank, name: resultName, point: item.point, text: item.text };
            }
        }
        return { rank: data[0].rank, name: data[0].items[0], point: data[0].point, text: data[0].text }; // fallback
    }

    function getRandomName(typeKey) {
        const data = gachaData[typeKey];
        const randomRank = data[Math.floor(Math.random() * data.length)];
        return randomRank.items[Math.floor(Math.random() * randomRank.items.length)];
    }

    function handleDraw() {
        if (state.isRolling) return;

        const step = stepsInfo[state.stepIndex].id;
        
        if (state.freeRolls[step] > 0) {
            state.freeRolls[step]--;
        } else {
            state.lifespan -= 20;
        }

        if (state.lifespan <= 0) {
            state.lifespan = 0;
            state.screen = 'gameover';
            render();
            return;
        }

        state.isRolling = true;
        state.currentRollResult = null;
        render();

        let typeKey = step;
        if (step === 'face') {
            typeKey = state.results.gender.name === '男' ? 'face_male' : 'face_female';
        }

        const resultArea = document.getElementById('result-area');
        resultArea.innerHTML = `<div class="rolling-text">???</div>`;
        const textElement = resultArea.querySelector('.rolling-text');
        
        let rollCount = 0;
        const maxRolls = 20; 
        
        const rollInterval = setInterval(() => {
            textElement.textContent = getRandomName(typeKey);
            rollCount++;
            
            if (rollCount >= maxRolls) {
                clearInterval(rollInterval);
                state.currentRollResult = roll(typeKey);
                state.isRolling = false;
                render();
            }
        }, 50); 
    }

    function handleNext() {
        if (state.isRolling) return;
        const step = stepsInfo[state.stepIndex].id;
        state.results[step] = state.currentRollResult;
        state.currentRollResult = null;

        if (state.stepIndex < stepsInfo.length - 1) {
            state.stepIndex++;
        } else {
            state.screen = 'result';
        }
        render();
    }

    function startGame() {
        state = getInitialState();
        state.screen = 'gacha';
        render();
    }

    function calculateFinalScore() {
        let score = state.lifespan;
        for (const key in state.results) {
            if (state.results[key]) score += state.results[key].point;
        }
        return score;
    }

    function getRank(score) {
        if (state.lifespan <= 0 || score <= 49) return 'E';
        if (score >= 230) return 'SS'; // 職業分しきい値を調整
        if (score >= 190) return 'S';
        if (score >= 150) return 'A';
        if (score >= 110) return 'B';
        if (score >= 70) return 'C';
        if (score >= 50) return 'D';
        return 'E';
    }

    function getGuideMessage() {
        if (state.screen === 'title') return "「あなたの寿命は100年。寿命と引き換えに、運命をやり直すことができますよ……フフフ。」";
        
        if (state.screen === 'gacha') {
            if (state.isRolling) return "「さあ、何が出るでしょうか……！」";
            
            if (state.currentRollResult) {
                const rank = state.currentRollResult.rank;
                if (rank === 'PLR') return "「素晴らしい！！これ以上の結果を求めるなんて、強欲にも程がありますよ？」";
                if (rank === 'SSR') return "「おおっ！かなりの豪運ですね。ここで確定しても良いのでは？」";
                if (rank === 'N') return "「うわぁ……これは酷い。さすがに寿命を払ってでも引き直した方が良いかと……。」";
                if (state.lifespan === 20) return "「おやおや、次引き直すと寿命が尽きて死にますよ？賭けますか？」";
                return "「あと20年寿命を払えば、もっと良い結果になるかもしれませんよ？」";
            } else {
                if (state.lifespan === 100) return "「さあ、運命のダイスを振りましょう。」";
                if (state.lifespan <= 40) return "「だいぶ寿命が減ってきましたね。計画的に行きましょう。」";
                return "「後悔のない選択をしてくださいね。」";
            }
        }
        return "「……」";
    }

    function getSpecialTitle(r) {
        const ranks = [r.country.rank, r.face.rank, r.family.rank, r.job.rank];
        const isAllPlrSsr = ranks.every(rank => rank === 'PLR' || rank === 'SSR');
        const isAllN = ranks.every(rank => rank === 'N');
        
        if (isAllPlrSsr) return "神に愛されし者";
        if (isAllN) return "不憫すぎる魂";
        
        if (r.family.rank === 'PLR' && r.job.name === "ニート") return "高等遊民";
        if (r.family.rank === 'N' && r.job.rank === 'PLR') return "成り上がりの英雄";
        if (r.face.rank === 'N' && r.job.name === "アイドルグループのセンター") return "奇跡のセンター";
        
        if (state.lifespan <= 20 && getRank(calculateFinalScore()) >= 'A') return "背水の陣の覇者";
        if (state.lifespan === 100) return "妥協の達人";
        
        if (r.country.name === "北朝鮮" && r.family.rank === 'PLR') return "将軍様の一族";
        if (r.country.name === "シーランド公国(幻)") return "幻の国民";

        return null;
    }

    // --- 描画処理 ---
    const appElement = document.getElementById('app');

    function render() {
        appElement.innerHTML = ''; 

        if (state.screen === 'title') {
            appElement.innerHTML = `
                <div class="screen">
                    <h1 class="title">輪廻転生<br>ランダムリセマラ</h1>
                    <p class="subtitle">寿命を削って、理想の初期ステータスと職業を手に入れろ</p>
                    <div class="guide-character" style="margin-bottom: 40px; justify-content: center;">
                        <span class="guide-icon">👼</span>
                        <p class="guide-text">${getGuideMessage()}</p>
                    </div>
                    <button class="btn btn-draw" onclick="startGame()" style="width: 200px; font-size: 1.2rem;">転生を開始する</button>
                </div>
            `;
        } 
        else if (state.screen === 'gacha') {
            const stepId = stepsInfo[state.stepIndex].id;
            const stepName = stepsInfo[state.stepIndex].name;
            const freeCount = state.freeRolls[stepId];
            
            const btnText = freeCount > 0 
                ? `ガチャを引く <span class="free-text">（無料：残り${freeCount}回）</span>` 
                : `引き直す <span class="free-text">（寿命20年消費）</span>`;
            
            const isDanger = state.lifespan <= 20 && freeCount === 0;

            const currentStatusHtml = `
                <div class="current-status">
                    <span>国<strong>${state.results.country ? state.results.country.name : '???'}</strong></span>
                    <span>性別<strong>${state.results.gender ? state.results.gender.name : '???'}</strong></span>
                    <span>顔<strong>${state.results.face ? state.results.face.name : '???'}</strong></span>
                    <span>家庭<strong>${state.results.family ? state.results.family.name : '???'}</strong></span>
                    <span>職業<strong>${state.results.job ? state.results.job.name : '???'}</strong></span>
                </div>
            `;

            let flashClass = '';
            if (state.currentRollResult && !state.isRolling) {
                const r = state.currentRollResult.rank;
                if (r === 'PLR') flashClass = 'flash-PLR';
                else if (r === 'SSR') flashClass = 'flash-SSR';
                else flashClass = 'flash-normal';
            }

            appElement.innerHTML = `
                <div class="guide-character">
                    <span class="guide-icon">👼</span>
                    <p class="guide-text">${getGuideMessage()}</p>
                </div>
                
                <div class="status-bar">
                    <span class="lifespan">残り寿命</span>
                    <span class="lifespan-value ${isDanger ? 'lifespan-danger' : ''}">${state.lifespan}年</span>
                </div>

                ${currentStatusHtml}

                <div class="gacha-panel fade-in">
                    ${flashClass ? `<div class="flash-effect ${flashClass}"></div>` : ''}
                    <h2 class="step-title">${stepName}</h2>
                    
                    <div class="gacha-result-area" id="result-area">
                        ${state.currentRollResult && !state.isRolling ? `
                            <div style="text-align: center; z-index: 2;">
                                ${state.currentRollResult.rank !== '-' ? `<div class="result-rank rank-${state.currentRollResult.rank}">${state.currentRollResult.rank}</div>` : `<div class="result-rank rank-none">決定</div>`}
                                <div class="result-name">${state.currentRollResult.name}</div>
                                <div class="result-text">${state.currentRollResult.text}</div>
                            </div>
                        ` : (state.isRolling ? `<div class="rolling-text">???</div>` : `<div style="color: #64748b; font-size: 2rem;">？</div>`)}
                    </div>

                    <div class="btn-container">
                        <button class="btn btn-draw" onclick="handleDraw()" ${state.isRolling || (state.currentRollResult && state.lifespan <= 0 && freeCount === 0) ? 'disabled' : ''}>
                            ${state.currentRollResult ? btnText : (freeCount > 0 ? `ガチャを引く <span class="free-text">（初回無料）</span>` : `ガチャを引く <span class="free-text">（寿命20年消費）</span>`)}
                        </button>
                        
                        ${state.currentRollResult && !state.isRolling ? `
                            <button class="btn btn-next fade-in" onclick="handleNext()">
                                この結果で次へ進む
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        else if (state.screen === 'gameover') {
            appElement.innerHTML = `
                <div class="screen">
                    <h1 class="gameover-text">転生失敗</h1>
                    <p class="story-text" style="text-align: center;">
                        欲をかきすぎた結果、生まれる前に寿命が尽きてしまいました。<br>
                        あなたは宇宙の塵となり、二度と転生することはできません。
                    </p>
                    <button class="btn btn-next" onclick="startGame()">もう一度輪廻の輪へ</button>
                </div>
            `;
        }
        else if (state.screen === 'result') {
            const score = calculateFinalScore();
            const rank = getRank(score);
            const r = state.results;
            
            const specialTitle = getSpecialTitle(r);
            const titleHtml = specialTitle ? `<div class="title-badge fade-in" style="animation-delay: 0.1s;">称号：${specialTitle}</div>` : '';

            const story = `あなたは<span class="highlight">【${r.country.name}】</span>の<span class="highlight">【${r.family.name}】</span>に、<br><span class="highlight">【${r.face.name}】</span>の<span class="highlight">【${r.gender.name}】</span>として生まれ、<br>最終的に<span class="highlight">【${r.job.name}】</span>になりました。<br><br>残りの寿命は<span class="highlight">【${state.lifespan}年】</span>です。`;

            let angelComment = "";
            if (rank === 'SS') angelComment = "「神をも恐れぬ完璧な人生ですね！いってらっしゃい！」";
            else if (rank === 'S' || rank === 'A') angelComment = "「素晴らしいスタートダッシュです。良い人生を！」";
            else if (rank === 'E') angelComment = "「……強く生きてくださいね。来世に期待しましょう。」";
            else angelComment = "「まあ、ありふれた人生になりそうですね。いってらっしゃい。」";

            appElement.innerHTML = `
                <div class="screen">
                    <h2 class="title" style="font-size: 2rem;">転生完了</h2>
                    
                    ${titleHtml}

                    <div class="story-text fade-in" style="animation-delay: 0.2s;">
                        ${story}
                    </div>
                    
                    <div class="final-rank-box fade-in" style="animation-delay: 0.4s; animation-fill-mode: both;">
                        <div class="final-rank-label">あなたの人生ランク</div>
                        <div class="final-rank-value rank-${rank}">${rank}</div>
                        <div style="color: #94a3b8; margin-top: 5px; font-size: 0.9rem;">総合スコア: ${score}pt</div>
                    </div>

                    <div class="guide-character fade-in" style="animation-delay: 0.6s; animation-fill-mode: both; width: 100%; justify-content: center;">
                        <span class="guide-icon">👼</span>
                        <p class="guide-text">${angelComment}</p>
                    </div>

                    <button class="btn btn-draw fade-in" onclick="startGame()" style="margin-top: 20px; animation-delay: 0.8s; animation-fill-mode: both; width: 200px;">
                        別の人生をやり直す
                    </button>
                </div>
            `;
        }
    }

    render();
</script>
</body>
</html>
